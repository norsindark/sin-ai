spring:
  application:
    name: sin-ai
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/sinai
    username: sinai
    password: ${SIN_AI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10250MB
      location: ${sinai.workflow.upload-directory}

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{jobId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: ${SINAI_OTEL_ENABLED:false}
  logging:
    export:
      enabled: ${SINAI_OTEL_ENABLED:false}
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.request.duration]": true
        "[sinai.translation.batch]": true
  otlp:
    metrics:
      export:
        enabled: ${SINAI_OTEL_ENABLED:false}
        url: ${SINAI_OTEL_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
        base-time-unit: seconds
  opentelemetry:
    resource-attributes:
      "[service.instance.id]": ${HOSTNAME:${COMPUTERNAME:local}}
    tracing:
      export:
        otlp:
          endpoint: ${SINAI_OTEL_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${SINAI_OTEL_ENDPOINT:http://localhost:4318}/v1/logs

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

sinai:
  security:
    jwt:
      secret: ${SINAI_JWT_SECRET:}
      issuer: sin-ai
      access-token-ttl: ${SINAI_JWT_TTL:1h}
    admin:
      username: ${SINAI_ADMIN_USERNAME:}
      email: ${SINAI_ADMIN_EMAIL:}
      password: ${SINAI_ADMIN_PASSWORD:}
    observability:
      token: ${SINAI_OBSERVABILITY_TOKEN:}
  storage:
    endpoint: http://localhost:${STORAGE_API_PORT:9000}
    access-key: ${STORAGE_APP_ACCESS_KEY}
    secret-key: ${STORAGE_APP_SECRET_KEY}
    raw-bucket: ${STORAGE_RAW_BUCKET:raw-videos}
    processed-bucket: ${STORAGE_PROCESSED_BUCKET:processed-videos}
    region: us-east-1
  media:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    timeout: 1h
  ai:
    whisper:
      base-url: http://localhost:${WHISPER_PORT:8000}
      model: ${WHISPER_MODEL:Systran/faster-whisper-small}
      timeout: 4h
      vad-filter: false
    ollama:
      base-url: http://localhost:${OLLAMA_PORT:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
      timeout: 5m
      batch-size: 8
  workflow:
    download-url-expiry: 1h
    temp-directory: ${java.io.tmpdir}/sin-ai
    upload-directory: ${sinai.workflow.temp-directory}/uploads
    worker:
      enabled: true
      poll-interval: 5s
