spring:
  application:
    name: sin-ai

sinai:
  storage:
    endpoint: http://localhost:${STORAGE_API_PORT:9000}
    access-key: ${STORAGE_APP_ACCESS_KEY}
    secret-key: ${STORAGE_APP_SECRET_KEY}
    raw-bucket: ${STORAGE_RAW_BUCKET:raw-videos}
    processed-bucket: ${STORAGE_PROCESSED_BUCKET:processed-videos}
    region: us-east-1
  media:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    timeout: 10m
  ai:
    whisper:
      base-url: http://localhost:${WHISPER_PORT:8000}
      model: ${WHISPER_MODEL:Systran/faster-whisper-small}
      timeout: 30m
    ollama:
      base-url: http://localhost:${OLLAMA_PORT:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
      timeout: 5m
      batch-size: 20
