plugins {
	id 'java'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.spring.dependency.management)
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

// Boot-managed Lombok (1.18.46) fails on JDK 27 (ExceptionInInitializerError in javac).
ext['lombok.version'] = '1.18.48'

repositories {
	mavenCentral()
}

dependencies {
	implementation libs.spring.boot.starter.actuator
	implementation libs.spring.boot.starter.data.jpa
	implementation libs.spring.boot.starter.security
	implementation libs.spring.boot.starter.validation
	implementation libs.spring.boot.starter.webmvc
	compileOnly libs.lombok
	runtimeOnly libs.postgresql
	annotationProcessor libs.lombok
	testImplementation libs.spring.boot.starter.actuator.test
	testImplementation libs.spring.boot.starter.data.jpa.test
	testImplementation libs.spring.boot.starter.security.test
	testImplementation libs.spring.boot.starter.validation.test
	testImplementation libs.spring.boot.starter.webmvc.test
	testCompileOnly libs.lombok
	testRuntimeOnly libs.junit.platform.launcher
	testAnnotationProcessor libs.lombok
}

tasks.register('dockerUp', Exec) {
	group = 'docker'
	description = 'Starts the Docker infrastructure (PostgreSQL) and waits until it is healthy.'
	commandLine 'docker-compose', '-f', 'docker/compose.yaml', 'up', '-d', '--wait'
}

tasks.register('dockerDown', Exec) {
	group = 'docker'
	description = 'Stops the Docker infrastructure (data volume is kept).'
	commandLine 'docker-compose', '-f', 'docker/compose.yaml', 'down'
}

tasks.named('test') {
	useJUnitPlatform()
}
