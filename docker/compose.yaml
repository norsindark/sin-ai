services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sin_ai
      POSTGRES_USER: sin_ai
      POSTGRES_PASSWORD: ${SIN_AI_DB_PASSWORD:?set SIN_AI_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sin_ai -d sin_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the app itself in Docker with `docker compose --profile app up --build`.
  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SIN_AI_DB_URL: jdbc:postgresql://postgres:5432/sin_ai
      SIN_AI_DB_USER: sin_ai
      SIN_AI_DB_PASSWORD: ${SIN_AI_DB_PASSWORD:?set SIN_AI_DB_PASSWORD in .env}
    ports:
      - "8080:8080"

volumes:
  pgdata:
