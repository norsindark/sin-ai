name: sin-ai

volumes:
  postgres-data:
  storage-data:
  ollama-models:
  whisper-models:
  observability-data:

services:
  postgres:
    image: postgres:18-alpine
    env_file: ./postgres/postgres.env
    environment:
      POSTGRES_PASSWORD: ${SIN_AI_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinai -d sinai"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  storage:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    command: server /data --console-address ":9001"
    env_file: ./minio/minio.env
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?}
      MINIO_API_CORS_ALLOW_ORIGIN: ${STORAGE_CORS_ORIGIN:?}
      MINIO_LICENSE: ${MINIO_LICENSE:?}
    ports:
      - "127.0.0.1:${STORAGE_API_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  storage-init:
    image: quay.io/minio/aistor/mc:RELEASE.2026-09-19T15-24-59Z
    entrypoint: ["/bin/sh", "/init-storage.sh"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?}
      STORAGE_APP_ACCESS_KEY: ${STORAGE_APP_ACCESS_KEY:?}
      STORAGE_APP_SECRET_KEY: ${STORAGE_APP_SECRET_KEY:?}
      STORAGE_RAW_BUCKET: ${STORAGE_RAW_BUCKET:-raw-videos}
      STORAGE_PROCESSED_BUCKET: ${STORAGE_PROCESSED_BUCKET:-processed-videos}
    volumes:
      - ./minio/init-storage.sh:/init-storage.sh:ro
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    image: sin-ai-app:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sinai
      SIN_AI_DB_PASSWORD: ${SIN_AI_DB_PASSWORD:?}
      SINAI_STORAGE_ENDPOINT: http://storage:9000
      SINAI_STORAGE_PUBLICENDPOINT: http://localhost:${STORAGE_API_PORT:-9000}
      STORAGE_APP_ACCESS_KEY: ${STORAGE_APP_ACCESS_KEY:?}
      STORAGE_APP_SECRET_KEY: ${STORAGE_APP_SECRET_KEY:?}
      STORAGE_RAW_BUCKET: ${STORAGE_RAW_BUCKET:-raw-videos}
      STORAGE_PROCESSED_BUCKET: ${STORAGE_PROCESSED_BUCKET:-processed-videos}
      SINAI_AI_WHISPER_BASEURL: http://whisper:8000
      SINAI_AI_OLLAMA_BASEURL: http://ollama:11434
      WHISPER_MODEL: ${WHISPER_MODEL:?}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?}
      SINAI_OTEL_ENABLED: ${SINAI_OTEL_ENABLED:-false}
      SINAI_OTEL_ENDPOINT: http://observability:4318
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: [ai]
    ports:
      - "127.0.0.1:${WHISPER_PORT:-8000}:8000"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  whisper-init:
    image: curlimages/curl:8.10.1
    profiles: [ai]
    entrypoint: ["/bin/sh", "-c", "curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --max-time 3600 -X POST \"http://whisper:8000/v1/models/$${WHISPER_MODEL}\""]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:?}
    depends_on:
      whisper:
        condition: service_started
    restart: "no"

  ollama:
    image: ollama/ollama:0.40.8
    profiles: [ai]
    env_file: ./ai/ai.env
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  observability:
    image: grafana/otel-lgtm:0.36.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - observability-data:/data
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/sin-ai.yaml:ro
      - ./observability/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/sin-ai:ro
    mem_limit: 1536m
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.40.8
    profiles: [ai]
    entrypoint: ["/bin/sh", "-c", "ollama pull $${OLLAMA_MODEL}"]
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:?}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
